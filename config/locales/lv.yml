    about:
      heading: "Par Braingency"
      lead: "Braingency ir programmatūras izstrādes uzņēmums, kas veido biznesa infrastruktūru — sistēmas, uz kurām balstās uzņēmumu ikdienas darbība, nevis mājaslapas, ko tie rāda publikai."
      intro:
        - "Mēs strādājam galvenokārt ar finanšu sektoru: kreditēšanas uzņēmumiem, kas piedāvā patēriņa kredītus, auto kredītus, līzingu un hipotekāros kredītus. Šiem klientiem mēs projektējam un veidojam pilnvērtīgas ERP un CRM platformas, kas aptver visu kreditēšanas ciklu, un izstrādājam mašīnmācīšanās modeļus, kas šos procesus izmērāmi uzlabo. Līdztekus šim pamatdarbam mēs veidojam izglītības platformas, AI asistentus un tirgus analītikas produktus."
      how_we_work:
        label: "Kā mēs strādājam"
        heading: "No idejas līdz mērogam — kā inženierijas funkcija"
        body:
          - "Mēs vedam produktus no idejas līdz mērogam. Tas nozīmē, ka esam iesaistīti tajā, lai definētu, kas jāizveido, projektētu sistēmas arhitektūru un datu modeli, rakstītu kodu, ieviestu sistēmu ražošanā un turpinātu to attīstīt, biznesam augot. Mūsu klienti nenodod mums specifikāciju, lai saņemtu atpakaļ melno kasti — mēs strādājam kā uzņēmuma inženierijas funkcija."
          - "Katra mūsu veidotā sistēma ir projektēta tā, lai izturētu izaugsmi, regulējuma atbilstību, datu integritāti un darbības efektivitāti. Kreditēšanā šīs nav izvēles īpašības: skoringa dzinējs, ko nevar auditēt, vai portfeļa sistēma, kas zaudē datus, vispār nav sistēma."
      ml_approach:
