          body:
            - "Platforma organizācijām, kas nodrošina strukturētu izglītību lielā mērogā. Kursu veidotāji var publicēt kursus, pieņemt maksājumus, uzdot un pārbaudīt mājasdarbus un sekot līdzi apmācāmo progresam — ar pilnībā automatizētu administratīvo procesu."
            - "Platformā ir iekļauts spēlifikācijas slānis, kas veidots, lai uzlabotu kursu pabeigšanas rādītājus un iesaisti, risinot atbiruma problēmu, kas skar lielāko daļu tiešsaistes mācību produktu."
          status: "Mēs izstrādājām mācību platformu Džonsa Hopkinsa universitātei Amerikas Savienotajās Valstīs."
