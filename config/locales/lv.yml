            - "Ieviešams AI tērzēšanas asistents, ko var iegult jebkurā mājaslapā. Caur administrācijas paneli asistenta zināšanu bāze tiek papildināta ar informāciju par uzņēmumu, ko tas pārstāv, tāpēc tas atbild, balstoties uz uzņēmuma reālo dokumentāciju, nevis vispārīgām atbildēm."
            - "Atšķirībā no atsevišķa tērzēšanas logrīka, asistentam ir savs CRM: katra saruna tiek saglabāta ar apkopotu ierakstu par to, ko klients jautāja un kas tika atrisināts, sniedzot pārdošanas un atbalsta komandām meklējamu klientu vajadzību vēsturi, nevis nesaistītu sarunu plūsmu."
