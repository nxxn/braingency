        verteo:
          index: "04"
          name: "Verteo — nekustamā īpašuma vērtēšana kreditētājiem"
          subheading: "Uz ML balstīta nekustamā īpašuma cenu prognozēšana"
          body:
            - "Verteo ir mūsu īpašumā esoša platforma nekustamā īpašuma vērtību analīzei un prognozēšanai. Tā balstās uz mūsu pašu mašīnmācīšanās modeli, kas apmācīts uz reāliem tirgus datiem, un sniedz atsevišķu īpašumu novērtējumus visā tirgū."
            - "Modeļa jēga ir atbalstīt lēmumu pieņemšanu: Verteo pastāv, lai palīdzētu kreditētājiem izlemt, cik daudz aizdot. Tieši precīzs un aktuāls ķīlas novērtējums nosaka pareizo kredīta summu, un kļūda jebkurā virzienā izmaksā dārgi — tā vai nu pakļauj kredītportfeli pārmērīgam riskam, vai liek atteikt labiem darījumiem."
            - "Tiešākie pielietojumi ir kreditēšanā: automatizēta ķīlas vērtēšana hipotekāro kredītu izvērtēšanā un īpašuma vērtības dati kredītspējas novērtēšanas sistēmām. Verteo ir tieši savienots ar mūsu kreditēšanas platformu, tāpēc hipotekāro kredītu var novērtēt pret aktuālu, uz modeli balstītu vērtējumu, nevis novecojušu novērtējumu."
