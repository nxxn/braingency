    ml_lab:
      heading: "Braingency ML laboratorija"
      lead: "Lietišķā mašīnmācīšanās konkrētām biznesa problēmām"
      what_it_is:
        label: "Kas ir ML laboratorija"
        heading: "Nodaļa, nevis blakusprojekts"
        body:
          - "ML laboratorija ir Braingency specializētā mašīnmācīšanās nodaļa. Tā pastāv tāpēc, ka modeļi, kas rada reālu biznesa vērtību, reti ir universāli — tie tiek apmācīti uz konkrēta uzņēmuma datiem, lai atrisinātu konkrētu lēmumu problēmu. Laboratorija veido šos modeļus, integrē tos produkcijas sistēmās un veic mūsu pašu pētniecību mašīnmācīšanās un mākslīgā intelekta jomā."
      what_we_do:
        label: "Ko mēs darām"
        own_products:
          heading: "Modeļi mūsu pašu produktos"
          body:
            - "Mūsu finanšu ERP platformā ir skoringa modulis, kurā mēs apmācām mašīnmācīšanās modeļus uz reāliem lietotāju datiem no kreditētāja paša portfeļa. Iegūtais modelis novērtē ienākošos kredītpieteikumus tieši izsniegšanas procesā — modelis nav atsevišķs analītikas produkts, tas ir daļa no tā, kā kredīts tiek apstiprināts."
            - "Verteo, mūsu nekustamā īpašuma vērtēšanas platforma, darbojas uz modeļa, kas pilnībā izstrādāts iekšēji un apmācīts uz Latvijas nekustamā īpašuma tirgus datiem. Tā sniedz cenu prognozes, kas tiek izmantotas hipotekāro kredītu ķīlas novērtēšanā un kredītspējas novērtēšanā."
        custom:
          heading: "Pielāgoti modeļi klientiem"
          body:
            - "Mēs veidojam mašīnmācīšanās modeļus pēc pasūtījuma uzņēmumiem dažādās nozarēs. Tipisks projekts sākas ar klienta esošajiem darbības datiem un lēmumu, ko viņi vēlas pieņemt labāk vai ātrāk — risku novērtēšana, pieprasījuma prognozēšana, klasifikācija, cenu noteikšana, anomāliju atklāšana. Mēs nodrošinām datu sagatavošanu, modeļa izstrādi, validāciju un integrāciju ražošanā."
            - "Tā kā mūsu inženierijas komanda veido sistēmas, kurās šie modeļi darbojas, nerodas nodošanas problēma, kas iznīcina lielāko daļu ML projektu: nav plaisas starp komandu, kas apmāca modeli, un komandu, kurai tas jāievieš."
        research:
          heading: "Pētniecība"
          body:
            - "Laboratorija veic pastāvīgu pētniecību mašīnmācīšanās un mākslīgā intelekta jomā, koncentrējoties uz nozarēm, kurās strādājam — kredītriska modelēšana, vērtēšana un lietišķais AI regulētā vidē."
      capabilities:
        label: "Kompetences un komanda"
        body: "ML laboratorija darbojas tajā pašā inženierijas organizācijā, kas veido mūsu produkcijas sistēmas. Mašīnmācīšanās kompetence ir integrēta visā dibinātāju komandā."
      cases:
        label: "Piemēri"
        heading: "Divi modeļi ražošanā"
        items:
          scoring:
            index: "Piemērs 01"
            title: "Kredītspējas novērtēšana"
            body: "Kreditēšanas klienta izvērtēšanas process balstījās uz statiskiem, uz noteikumiem balstītiem kritērijiem. Mēs apmācījām skoringa modeli uz viņu vēsturiskajiem pieteikumu un atmaksas datiem un integrējām to izsniegšanas procesā, ļaujot pieteikumus izvērtēt pret modeļiem, kas atklāti viņu faktiskajā portfeļa sniegumā."
          valuation:
            index: "Piemērs 02"
            title: "Nekustamā īpašuma vērtēšana"
            body: "Verteo: ML modelis, kas apmācīts uz Latvijas nekustamā īpašuma tirgus datiem un prognozē īpašumu vērtības, pielietots hipotekāro kredītu ķīlas novērtēšanā un skoringā."
      map:
        label: "Verteo visā valstī"
        heading: "Katra šūna ir vērtējums"
        body: "Verteo novērtē cenu katrai valsts daļai un pārrēķina to, ienākot jauniem darījumiem. Kur salīdzināmu darījumu ir maz, intervāls kļūst platāks — un modelis to parāda."
