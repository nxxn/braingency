    team:
      heading: "Komanda"
      lead: "Braingency vada divi praktizējoši inženieri. Abi dibinātāji raksta kodu, izvērtē arhitektūru un strādā tieši ar klientu sistēmām."
      roles:
        ceo: "Līdzdibinātāja un vadītāja"
        cto: "Līdzdibinātājs un tehnoloģiju direktors"
      members:
        shehurina:
          bio:
            - "Misela ir Braingency līdzdibinātāja un vadītāja, un drīzāk praktizējoša inženiere nekā no ikdienas darba attālināta vadītāja. Viņas galvenais tehnoloģiju kopums ir Ruby on Rails, un viņa personīgi projektē sistēmu arhitektūru un datu modeļus, veido un mērogo Rails lietotnes, ievieš finanšu loģiku un automatizācijas procesus, integrē banku, KYC, maksājumu un AI pakalpojumus un pārbauda visu kritisko kodu."
            - "Viņai ir maģistra grāds attīstības izglītībā un globālajā mācīšanā no UCL Izglītības institūta un bakalaura grāds biznesā un ekonomikā no Stokholmas Ekonomikas augstskolas Rīgā, kā arī papildu studijas London School of Economics and Political Science. Viņai ir sertifikāts uzraudzītajā mašīnmācīšanās (regresija un klasifikācija)."
            - "Pirms Braingency viņa bija Copy Brain, AI satura ģenerēšanas uzņēmuma, vadītāja un vairāk nekā desmit gadus līdztekus inženierijas darbam strādāja par matemātikas pasniedzēju. Viņas agrākajā karjerā ir vecākā projektu vadītāja un valdes locekles amati IT un biznesa konsultāciju jomā Rīgā."
        gnotovs:
          bio:
            - "Nikita ir Braingency līdzdibinātājs un tehnoloģiju direktors, vecākais pilna cikla Ruby arhitekts ar 15 gadu profesionālo pieredzi, kas specializējas fintech produktos un sarežģītās finanšu platformās."
            - "Viņš projektē sistēmu arhitektūras no pamatiem — datu modeļus, biznesa loģiku un mērogojamus API — ar uzsvaru uz drošību, veiktspēju un regulējuma prasībām. Viņa darbs aptver gan aizmuguri, gan priekšpusi, veidojot augstas slodzes sistēmas un integrējot banku API, maksājumu pakalpojumu sniedzējus, kredītspējas novērtēšanas pakalpojumus, KYC/KYB risinājumus un trešo pušu datu avotus. Viņš atbild par arhitektūras lēmumiem, tehnoloģisko stratēģiju un ilgtermiņa sistēmu mērogojamību, kā arī vada koda pārbaudi un mentoringu inženierijas komandā."
            - "Viņam ir bakalaura grāds finansēs no Baltijas Starptautiskās akadēmijas — finanšu un inženierijas izglītības apvienojums, kas ir tieši saistīts ar kreditēšanas sistēmām, ko veido Braingency."
            - "Viņa pieredzē ir CRM sistēmas, tiešsaistes izglītības platformas un sociālo tīklu platformas; viņš ir bijis Copy Brain tehnoloģiju direktors un vadošais izstrādātājs virknē produkcijas Rails sistēmu kopš 2010. gada."
      working:
        label: "Darbs Braingency"
        heading: "Neliela, pieredzējusi komanda"
        body:
          - "Mēs esam neliela, pieredzējusi komanda. Mūsu inženierijas kultūra balstās uz atbildību: cilvēki, kas projektē sistēmu, ir tie paši, kas to veido un uztur."
          - "Braingency ir apņēmies nodrošināt taisnīgu un iekļaujošu darba vidi. Mūsu dzimumu līdztiesības plāns nosaka, kā mēs to īstenojam praksē."
        link: "Lasīt mūsu dzimumu līdztiesības plānu"

