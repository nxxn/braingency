        pullquote: "Skoringa modelis, kas darbojas kredīta izsniegšanas procesā un uzlabo apstiprināšanas lēmumus, ir vērtīgāks nekā sarežģītāks modelis, kas nekad nepamet piezīmju grāmatiņu."
