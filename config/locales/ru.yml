          body:
            - "Verteo — наша собственная платформа для анализа и прогнозирования стоимости недвижимости. Она построена на нашей модели машинного обучения, обученной на реальных рыночных данных, и оценивает отдельные объекты по всему рынку."
            - "Смысл модели — поддержка принятия решений: Verteo существует, чтобы помогать кредиторам решать, сколько выдавать. Именно точная и актуальная оценка залога определяет правильную сумму кредита, а ошибка в любую сторону обходится дорого: либо кредитный портфель несёт избыточный риск, либо компания отказывает в надёжных сделках."
            - "Основное применение — в кредитовании: автоматическая оценка залога при ипотечном андеррайтинге и данные о стоимости недвижимости для систем кредитного скоринга. Verteo напрямую подключена к нашей кредитной платформе, поэтому ипотечную заявку можно оценивать по актуальной оценке модели, а не по устаревшему заключению оценщика."
