    team:
      heading: "Команда"
      lead: "Braingency возглавляют два практикующих инженера. Оба основателя пишут код, проверяют архитектуру и работают непосредственно над системами клиентов."
      roles:
        ceo: "Сооснователь и CEO"
        cto: "Сооснователь и CTO"
      members:
        shehurina:
          bio:
            - "Misela — сооснователь и CEO Braingency, практикующий инженер, а не руководитель, отстранённый от работы. Её основной стек — Ruby on Rails: она сама проектирует архитектуру систем и модели данных, создаёт и масштабирует Rails-приложения, реализует финансовую логику и конвейеры автоматизации, интегрирует банковские, KYC-, платёжные и ИИ-сервисы и проверяет весь критически важный код."
            - "Она получила степень магистра (MA) в области Development Education and Global Learning в Институте образования UCL и степень бакалавра (BSc) в области бизнеса и экономики в Стокгольмской школе экономики в Риге, а также дополнительно обучалась в Лондонской школе экономики и политических наук. Имеет сертификат по Supervised Machine Learning (регрессия и классификация)."
            - "До Braingency она была CEO компании Copy Brain, занимавшейся генерацией контента с помощью ИИ, и более десяти лет параллельно с инженерной работой преподавала математику. Ранее в её карьере — руководящие позиции в управлении проектами и должности управляющего директора в сфере ИТ и бизнес-консалтинга в Риге."
        gnotovs:
          bio:
            - "Nikita — сооснователь и CTO Braingency, senior full-stack Ruby-архитектор с 15-летним профессиональным опытом, специализирующийся на финтех-продуктах и сложных финансовых платформах."
            - "Он проектирует архитектуру систем с нуля — модели данных, бизнес-логику и масштабируемые API — с упором на безопасность, производительность и регуляторные требования. Его работа охватывает бэкенд и фронтенд: высоконагруженные системы, интеграции с банковскими API, платёжными провайдерами, сервисами кредитного скоринга, KYC/KYB-решениями и сторонними источниками данных. Он отвечает за архитектурные решения, техническую стратегию и долгосрочную масштабируемость систем, а также руководит код-ревью и менторством в инженерной команде."
            - "Он получил степень бакалавра финансов в Балтийской международной академии — сочетание финансовой и инженерной подготовки, напрямую связанное с кредитными системами, которые создаёт Braingency."
            - "В его портфолио — CRM-системы, платформы онлайн-образования и сетевые платформы; он был CTO компании Copy Brain и с 2010 года работал ведущим разработчиком в целом ряде промышленных Rails-систем."
      working:
        label: "Работа в Braingency"
        heading: "Небольшая команда опытных специалистов"
        body:
          - "Мы — небольшая команда опытных специалистов. Наша инженерная культура построена на ответственности: те, кто проектирует систему, сами её создают и поддерживают в рабочем состоянии."
          - "Braingency стремится к справедливой и инклюзивной рабочей среде. Наш План гендерного равенства описывает, как мы реализуем это на практике."
