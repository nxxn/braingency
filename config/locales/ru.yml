    ml_lab:
      heading: "Braingency ML Lab"
      lead: "Прикладное машинное обучение для конкретных бизнес-задач"
      what_it_is:
        label: "Что такое ML Lab"
        heading: "Подразделение, а не побочный проект"
        body:
          - "ML Lab — специализированное подразделение Braingency по машинному обучению. Оно существует потому, что модели, которые приносят бизнесу реальную пользу, редко бывают универсальными: их обучают на данных конкретной компании для решения конкретной задачи принятия решений. Лаборатория создаёт такие модели, встраивает их в промышленные системы и ведёт собственные исследования в области машинного обучения и ИИ."
      what_we_do:
        label: "Что мы делаем"
        own_products:
          heading: "Модели внутри наших собственных продуктов"
          body:
            - "Наша финансовая ERP-платформа включает скоринговый модуль, в котором мы обучаем модели машинного обучения на реальных данных пользователей из собственного портфеля кредитора. Полученная модель оценивает входящие кредитные заявки прямо внутри процесса выдачи — модель не отдельный аналитический продукт, а часть того, как одобряется кредит."
            - "Verteo, наша платформа оценки недвижимости, работает на модели, полностью созданной внутри компании и обученной на данных латвийского рынка недвижимости. Она формирует ценовые прогнозы, которые используются для оценки ипотечного залога и в качестве входных данных для кредитного скоринга."
        custom:
          heading: "Индивидуальные модели для клиентов"
          body:
            - "Мы создаём модели машинного обучения на заказ для компаний из разных отраслей. Типичный проект начинается с имеющихся операционных данных клиента и решения, которое он хочет принимать лучше или быстрее: оценка рисков, прогнозирование спроса, классификация, ценообразование, выявление аномалий. Мы берём на себя подготовку данных, разработку модели, валидацию и интеграцию в рабочие системы."
            - "Поскольку наша инженерная команда сама создаёт системы, внутри которых работают модели, проблема передачи, губящая большинство ML-проектов, у нас не возникает: нет разрыва между командой, которая обучает модель, и командой, которой предстоит её внедрять."
        research:
          heading: "Исследования"
          body:
            - "Лаборатория ведёт постоянные исследования в области машинного обучения и ИИ, сосредоточенные на тех сферах, в которых мы работаем: моделирование кредитного риска, оценка стоимости и прикладной ИИ в регулируемой среде."
