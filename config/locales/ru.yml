          - "Каждая наша система проектируется с расчётом на рост, соответствие регуляторным требованиям, целостность данных и операционную эффективность. В кредитовании это не опциональные качества: скоринговый движок, который нельзя проаудировать, или портфельная система, теряющая данные, — это вовсе не система."
