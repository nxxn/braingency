    intro:
    - 'Почти всю историю великая нерешённая задача в математике работала как маяк. Поколения математиков плыли к ней и по пути открывали новые континенты: целые разделы математики, на которых в итоге держится современный мир, от криптографии до прогнозов погоды.'
    - В сентябре 2026 года этот ритм сломался. ИИ-система OpenAI предложила доказательство одной из семи задач тысячелетия. Это самые трудные вопросы, которые математики поставили перед собой на рубеже веков, и за каждый обещан миллион долларов. Через неделю двадцать пять лауреатов Филдсовской премии, высшей награды в математике, опубликовали предупреждение. Ещё через месяц OpenAI ответила открытым каталогом из сотен новых результатов.
    - 'В этой статье мы разбираем, что произошло, о чём спорят стороны и почему в braingency мы считаем, что правильный ответ — не тормозить, а готовить гораздо больше людей, способных работать вместе с этими машинами. Все графики ниже интерактивные: переключайте, фильтруйте, листайте. В конце оставьте свой голос.'
    timeline:
      heading: Пять недель, которые потрясли математику
      sub: Пролистайте, что происходило с 1 сентября по 6 октября 2026 года.
      body:
      - 'Уравнения Навье–Стокса описывают движение жидкостей и газов: воздух над крылом, кровь в артерии, погоду над Атлантикой. Инженеры пользуются ими каждый день. Но почти сто лет никто не мог ответить на простой вопрос. Если течение в начале гладкое, может ли в какой-то момент скорость стать бесконечной? Математики называют это «взрывом» решения. Если такое возможно, в этой точке уравнения перестают описывать реальность.'
      - 'Система OpenAI ответила: да. Она построила вихрь, который закручивается внутрь и вытягивается, как спагетти, становясь всё быстрее и тоньше, пока за конечное время скорость в его центре не становится бесконечной. Полная энергия при этом остаётся конечной.'
      - 'Отмахнуться от результата трудно благодаря <strong>Lean</strong> — языку программирования, в котором каждый шаг доказательства проверяет компьютер. В доказательстве на Lean нельзя спрятать пробел так, как в статье на 200 страниц. Не менее интересно, как доказательство нашли: не одна модель в одиночку, а тысячи ИИ-агентов, работавших группами, обменивавшихся частичными идеями и перенаправлявшихся на самые перспективные подходы.'
      figure: fig. 01 — пять недель осени
      prev: "← Назад"
      next: Далее →
      year: " 2026"
      steps:
      - date: 1 сент.
        who: ai
        tag: OpenAI
        title: Агенты берутся за задачи тысячелетия
        body: 'Услышав слухи, что две задачи тысячелетия уже решены, OpenAI направляет новую внутреннюю модель на все открытые. Группы агентов получают разные варианты каждой задачи: доказать или опровергнуть.'
        stats:
        - - "≈10 000"
          - агентов одновременно
        - - '6'
          - открытых задач тысячелетия
      - date: 5 сент.
        who: ai
        tag: OpenAI
        title: Навье–Стокс поддаётся
        body: 'Через 88 часов одна из групп находит гладкое течение, которое за конечное время развивает бесконечную скорость: вихрь, вытянутый как спагетти. Ещё 17 часов уходит на полную формализацию в Lean.'
        stats:
        - - 88 ч
          - до доказательства
        - - 2,7 млн
          - сообщений агентов
        - - 130 млрд
          - токенов на выходе
      - date: 8 сент.
        who: ai
        tag: OpenAI
        title: Объявление
        body: OpenAI публикует доказательство и его проверку в Lean, заявляет, что не будет претендовать на премию, и признаёт приоритет Левента Алпёге и Тристана Букмастера, которые с моделью Anthropic первыми решили близкую задачу для уравнений Эйлера.
        stats:
        - - '2'
          - задачи гидродинамики
        - - "$1 млн"
          - премия не востребована
      - date: 11 сент.
        who: hm
        tag: Математики
        title: 25 филдсовских лауреатов возражают
        body: 'Теренс Тао, Петер Шольце, Марина Вязовска и ещё 22 математика публикуют декларацию: цели ИИ-компаний и математики серьёзно расходятся. Решение задач всегда было лишь косвенным признаком понимания.'
        stats:
        - - '25'
          - лауреатов Филдсовской премии
        - - 1978–2026
          - годы их медалей
      - date: 6 окт.
        who: ai
        tag: OpenAI
        title: 'Ответ: каталог'
        body: OpenAI выкладывает на GitHub 719 рукописей с историей версий, правилами цитирования, конспектами рассуждений и доказательствами в Lean для части из них, и обещает финансировать воркшопы по осмыслению результатов ИИ.
        stats:
        - - '719'
          - рукописей
        - - "≈4 000"
          - поставленных задач
        - - 42%
          - проверено в Lean
    debate:
      heading: Декларация и ответ
      sub: Выберите претензию математиков и переключитесь, чтобы увидеть, что через месяц ответила OpenAI.
      body:
      - 'Декларация называется <em>A Severe Misalignment of ИИ in Mathematics</em> («Серьёзное рассогласование ИИ и математики»). Она короткая, но подписи под ней весят очень много: Теренс Тао, Петер Шольце, Максим Концевич, Марина Вязовска, Пьер Делинь и ещё двадцать филдсовских лауреатов, получивших медали с 1978 по 2026 год.'
      - 'Главный аргумент старый, но в новых обстоятельствах. Знаменитую задачу никогда не ценили только за ответ. Её ценность была в том, что решение заставляло изобрести новые идеи, которые сообщество потом годами обсуждало, упрощало и преподавало, пока они не становились материалом учебников. Когда машина выдаёт ответ без этого пути, сигнал остаётся, а то, о чём он раньше сигнализировал, может исчезнуть. Экономисты называют это законом Гудхарта: когда показатель становится целью, он перестаёт быть хорошим показателем.'
      - 'Авторы также возражают против того, как публикуются результаты: быстро, без нормального изложения и ссылок на предшественников. И они беспокоятся о студентах, которым дают задачи именно для того, чтобы они росли, решая их. Всё это они видят как предвестие того, с чем столкнётся любая интеллектуальная профессия.'
      after: 'Декларация не требует запретить ИИ. Теренс Тао сам пользуется им каждый день и вскоре после декларации написал, что математиков понадобится гораздо больше, а не меньше. Спор о другом: кто задаёт цели — маркетинговые отделы или научное сообщество.'
      side_mathematicians: Что сказали математики
      side_openai: Что ответила OpenAI
      who:
      - Филдсовские лауреаты
      - OpenAI, 6 октября
      figure: fig. 02 — претензия и ответ
      note: Оценки — наша интерпретация
      claims:
      - title: Результаты объявляют в спешке
        verdict: part
        verdict_text: Частично
        quote: Нет времени на нормальное изложение.
        mathematicians: Решения объявляют раньше, чем кто-то их нормально описал, выделил новые методы или обсудил на докладах и в статьях.
        openai: Теперь всё лежит в <strong>репозитории на GitHub с историей версий</strong> и правилами исправлений, а OpenAI обещает лучшее изложение в будущих релизах. Но 719 рукописей за раз — всё равно гораздо больше, чем сообщество способно быстро прочитать.
      - title: Можно ли доверять доказательствам?
        verdict: ok
        verdict_text: Учтено
        quote: Проверка нового результата занимает у людей месяцы и годы.
        mathematicians: Человеческая проверка большого доказательства идёт медленно, а ошибки могут прятаться на сотнях страниц.
        openai: Около <strong>42% главных результатов формализованы в Lean</strong>, то есть каждый шаг проверил компьютер. Про остальные OpenAI прямо пишет, что в них могут быть ошибки и их будут исправлять.
      - title: Авторство и плагиат
        verdict: ok
        verdict_text: Учтено
        quote: Кому принадлежит заслуга и на чьей работе всё построено?
        mathematicians: Как и в любой творческой профессии, поспешные результаты ИИ поднимают трудные вопросы авторства и ссылок на тех, чьи идеи были первыми.
        openai: У каждой рукописи теперь есть <strong>правила цитирования</strong>. В истории с уравнениями Эйлера OpenAI публично признала приоритет другой команды. Компания также консультируется с независимой группой при Институте перспективных исследований в Принстоне.
      - title: Цепочка передачи знаний
        verdict: part
        verdict_text: Частично
        quote: Идеи оживают, только когда их несут люди.
        mathematicians: Без математиков, которые встроят идеи ИИ в науку, эти идеи так и не оживут, а цепочка от учителя к ученику прервётся.
        openai: OpenAI будет <strong>финансировать воркшопы, конференции и программы</strong> по осмыслению результатов ИИ и опубликовала конспекты рассуждений модели для десяти результатов, чтобы можно было проследить её путь.
      - title: Что будет со студентами?
        verdict: 'no'
        verdict_text: Без ответа
        quote: Мы даём студентам задачи, чтобы они росли.
        mathematicians: Задачи для студентов нужны, чтобы развивать навыки и зрелость. Если ответы достаются даром, эта тренировка исчезает.
        openai: "<strong>Прямого ответа нет</strong> в публикации OpenAI. По-моему, это самый важный открытый вопрос, и на него пытается ответить вся оставшаяся часть статьи."
    scale:
      heading: Люди и ИИ на одной шкале
      sub: Переключайтесь между поиском и проверкой доказательства. Потом включите линейную шкалу и посмотрите, как столбики ИИ почти исчезают.
      body:
      - У математического результата две цены. Сначала кто-то должен найти доказательство. Потом все остальные должны убедиться, что оно верно. У людей оба шага медленные. Эндрю Уайлс почти в одиночку семь лет работал над теоремой Ферма. Когда Григорий Перельман опубликовал доказательство гипотезы Пуанкаре, нескольким группам экспертов понадобилось около трёх лет, чтобы его подтвердить. Компьютерное доказательство гипотезы Кеплера Томаса Хейлса было настолько трудно проверить, что он запустил проект формальной проверки, и тот занял ещё одиннадцать лет.
      - 'ИИ меняет обе цифры сразу. График ниже ставит их рядом. По умолчанию шкала логарифмическая: каждое деление в десять раз больше предыдущего. Только так часы и десятилетия помещаются на одной линии.'
      after: 'Сравнение не совсем честное: модель стоит на плечах всех математиков прошлого. Но сдвиг масштаба реален. За 26 лет с объявления задач тысячелетия люди решили ровно одну — гипотезу Пуанкаре. В одном только каталоге OpenAI сейчас <strong>719 рукописей в 372 семействах</strong>. Они получены примерно из 4 000 поставленных задач, в среднем около трёх часов вычислений на результат. Около 42% главных результатов формально проверены в Lean.'
