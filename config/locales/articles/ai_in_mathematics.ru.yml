      items:
      - name: Гипотеза Кеплера
        story: Насколько плотно можно упаковать шары? Томас Хейлс доказал догадку Кеплера в 1998 году с большой помощью компьютера. Полная формальная проверка (Flyspeck) заняла время до 2014 года.
      - name: Теорема Ферма
        story: Эндрю Уайлс работал над ней почти в одиночку семь лет. По пути математика получила теорию идеалов в XIX веке и методы модулярности в XX.
      - name: Проблема четырёх красок
        story: Доказательство Аппеля и Хакена стало первой крупной теоремой, опирающейся на компьютер, и вызвало годы споров о том, что считать доказательством.
      - name: Гипотеза Римана
        story: Всё ещё открыта. OpenAI сообщает об области без нулей при Re(s) > 11/12. Это не сама гипотеза, но если результат подтвердится, такую полосу доказали впервые.
      - name: Гипотеза Пуанкаре
        story: Доказательство Григория Перельмана — единственная задача тысячелетия, решённая людьми. Он отказался и от Филдсовской медали, и от премии в $1 млн.
      - name: Навье–Стокс
        story: Открыта со времён работы Лере 1934 года. Агенты OpenAI показали, что гладкое течение может «взорваться» за конечное время. Доказательство формализовано в Lean; на премию OpenAI не претендует.
      - name: Гипотеза Малера
        story: Вопрос о минимальном произведении объёмов выпуклого тела и его двойственного. Входит в результаты OpenAI, опубликован конспект рассуждений модели.
      - name: Факторы свободных групп
        story: Изоморфны ли разные факторы свободных групп — центральный вопрос теории операторных алгебр со времён Мюррея и фон Неймана. OpenAI включает его в свои результаты.
      - name: Гипотеза Ходжа
        story: В общем виде всё ещё открыта. OpenAI сообщает о доказательстве важного частного случая — абелевых многообразий с комплексным умножением.
    professions:
      heading: Профессии всегда менялись
      sub: Я 13 лет преподавала математику. Я понимаю эту тревогу. Но смотрю на ситуацию иначе.
      pull: Если цель науки — двигать цивилизацию вперёд, то <em>скорость получения результата</em> имеет огромное значение.
      body:
      - Чем быстрее мы получаем ответы, тем быстрее можем задавать следующие вопросы. Впервые прорыв, на который раньше уходило несколько поколений, может уместиться <strong>в одну человеческую жизнь</strong>. Отказываться от этого ради привычного уклада, по-моему, неправильно.
      - 'Через это прошла каждая профессия. Каждому человеку в моменте было трудно перестраиваться. Но вместе эти перемены построили мир, который гораздо лучше прежнего. Поэтому я бы сместила приоритет: не сохранять условия, в которых десятилетиями ничего не меняется, а учиться быстро адаптироваться и перестраивать свою работу.'
      - За годы в классе я поняла главное. <strong>Мы никогда не учили ради ответа в конце задачника. Мы учили людей думать.</strong> Именно поэтому ИИ меня не пугает. Он не отменяет мышление, он поднимает его на новый уровень.
      then: Тогда
      now: Сейчас
      figure: fig. 05 — работа переживает инструмент
      jobs:
      - - Тапёр в кинотеатре
        - Саундтрек к фильму
      - - Лифтёр
        - Лифт с кнопками
      - - Программист на перфокартах
        - IDE и ИИ-напарник
      - - Машинистка
        - Текстовый редактор
      - - Наборщик в типографии
        - Настольная издательская система
      - - Доказывать каждую лемму вручную
        - Выбирать вопросы, направлять ИИ, понимать результаты
    scientists:
      heading: Нам нужно больше учёных, а не меньше
      sub: Наука будет трансформироваться и ускоряться. Именно поэтому нам как никогда нужно больше учёных во всех областях, чтобы двигать её вперёд.
      pull: ИИ уравнивает позиции. Больше не нужно тратить <em>сотни тысяч</em> на элитное образование, если ты способный и умеешь задавать вопросы.
      body: 'Скоро такие модели будут доступны всем. Студент из небольшого города получит инструмент, который ещё вчера был только у лучших лабораторий мира. Талант перестаёт зависеть от того, где ты родился и сколько стоил твой диплом. Математика, физика, биология, медицина, материаловедение: каждой области понадобятся люди, которые задают вопросы, направляют машины и превращают результаты в технологии, лекарства и новые знания.'
      before: До ИИ
      with: С ИИ
      figure: fig. 06 — кто может заниматься наукой
      access:
      - label: Порог входа
        before:
        - Элитный диплом
        - Часто сотни тысяч за обучение
        with:
        - Любопытство и хорошие вопросы
        - Передовая модель стоит как подписка
      - label: Инструменты
        before:
        - То, что может позволить лаборатория
        - Лучшие инструменты — у немногих институтов
        with:
        - Та же модель, что у лучших лабораторий
        - Доступна везде и на любом языке
      - label: Кто участвует
        before:
        - Несколько тысяч специалистов в области
        - Многое решает география
        with:
        - Любой способный человек где угодно
        - Решает талант, а не адрес
      - label: Узкое место
        before:
        - Время людей на вычисления и проверку
        - Годы на сложный результат
        with:
        - Compute и выбор вопросов
        - Часы на сложный результат
      budget_heading: 'Новый навык: максимум прогресса на единицу compute'
      budget_body: 'Вычислительные мощности останутся ограниченными и дорогими. Только на задачу Навье–Стокса ушли миллионы сообщений между агентами. Учёный будущего решает, какой вопрос задать первым, на что потратить бюджет и какой результат заслуживает глубокого осмысления. Попробуйте: у вас <strong>100 единиц compute</strong>. Соберите свой исследовательский портфель.'
      score: Индекс прогресса
      used: Использовано compute
      gained: Получено понимания
      reset: Сбросить портфель
      budget_figure: fig. 07 — исследовательский бюджет
      illustrative: Условные данные
      units: ед.
      tasks:
      - - Атаковать знаменитую открытую задачу перебором
        - Громкий заголовок, но доказательство, на котором пока ничего не построить
      - - Попросить модель объяснить и упростить доказательство ИИ
        - Превратить результат на 200 страниц в метод, которым смогут пользоваться люди
      - - Проверить собственную гипотезу
        - Поиск контрпримеров к вашему новому вопросу
      - - Формализовать ключевой результат в Lean
        - Сделать одно важное доказательство полностью надёжным
      - - Перенос между областями
        - Применить метод гидродинамики к модели из биологии
      - - Сгенерировать 500 вариантов известной леммы
        - Много текста, мало нового
      verdicts:
        idle: Выберите задачи слева. Каждая стоит compute, бюджет фиксирован.
        headline: Громкий заголовок, но строить на этом почти нечего. Именно об этой ловушке предупреждают филдсовские лауреаты.
        volume: Много результатов, мало понимания. Объём — это не прогресс.
        strong: 'Сильный портфель: новые результаты плюс понимание, нужное для следующих вопросов.'
        mixed: Неплохо. Попробуйте сочетать открытия с работой, которая делает результаты понятными.
      after: Здесь мой взгляд и позиция математиков сходятся. Умение задавать правильные вопросы и понимать ответы становится главным навыком учёного. Просто я вижу в ИИ причину развивать этот навык быстрее, а не угрозу ему.
    freedom:
      heading: Свобода и путь вверх
      sub: Две идеи не из математики, которые, как мне кажется, объясняют, что на самом деле поставлено на карту.
      existentialists:
        eyebrow: Экзистенциалисты
        pull: Чем больше ИИ может сделать за нас, тем больше у нас <em>свободы</em> выбирать, кем стать.
        body:
        - 'Философы-экзистенциалисты весь XX век размышляли над вопросом, который вдруг стал практическим. Кьеркегор описывал головокружение, которое испытывает человек перед открытой возможностью. Сартр писал, что мы <strong>обречены быть свободными</strong>: нет заданной природы или сценария, которые решают за нас, поэтому каждый выбор наш, и ответственность за него тоже.'
        - 'Большую часть истории эту свободу ограничивала необходимость. Годы жизни уходили на вычисления, переписывание, проверку и запоминание просто потому, что кто-то должен был это делать. Чем больше этой работы берёт на себя ИИ, тем меньше необходимости, и вопрос экзистенциалистов становится ежедневным вопросом каждого: <strong>раз машина может это сделать, что выбираю делать я?</strong> Мне кажется, именно здесь мы сейчас и находимся. Свобода неизбежна. Что мы с ней сделаем, зависит от нас.'
      brodsky:
        eyebrow: Иосиф Бродский, Нобелевская лекция, 1987
        pull: Не искусство должно говорить языком толпы, а люди должны учиться говорить <em>языком искусства</em>.
        body:
        - В своей Нобелевской лекции Бродский перевернул привычное требование. Не литература должна опускаться до повседневной речи масс, а народ должен подниматься до языка литературы. Я понимаю это как позицию против упрощения искусства ради массовой аудитории. Литература, по Бродскому, должна поднимать человека на новый интеллектуальный уровень, а не приспосабливаться к уже привычному уровню речи и мышления.
        - 'Я считаю, что то же самое верно и для ИИ. <strong>Простой путь — использовать его, чтобы оставаться там, где мы есть</strong>: меньше думать, меньше писать, меньше понимать и позволить машине заполнить пустоту. Гораздо более интересный и полезный для общества и цивилизации путь — выйти с его помощью на новый уровень, и обществу в целом, и каждому человеку в отдельности.'
      easy: Простой путь
      high: Путь вверх
      figure: fig. 10 — один инструмент, два направления
      paths:
      - label: Студент
        easy:
        - Получает ответ к домашнему заданию
        - Оценка в порядке, ничего не выучено
        high:
        - Спорит с ИИ о том, почему так
        - Доходит до идей на годы раньше программы
      - label: Математик
        easy:
        - Копит доказательства, которые никто не читает
        - Результаты копятся как чёрные ящики
        high:
        - Превращает доказательства ИИ в новые методы
        - Задаёт вопросы, которые раньше никто не мог задать
      - label: Писатель
        easy:
        - Генерирует текст на привычном уровне
        - Язык сползает к среднему
        high:
        - Использует ИИ как требовательного редактора
        - Пишет лучше, чем смог бы один
      - label: Общество
        easy:
        - Та же мысль, только быстрее
        - Удобство без роста
        high:
        - Больше людей занимаются настоящей наукой
        - Более высокий общий уровень мысли
      notes:
      - Удобно и быстро. Уровень мышления остаётся прежним.
      - Труднее и сначала медленнее, но только этот путь делает нас больше, чем мы были.
    poll:
      heading: А вы на чьей стороне?
      sub: Весь спор сводится к тому, что мы максимизируем. Подвиньте ползунок, чтобы изучить каждую позицию, и проголосуйте.
      body:
      - 'Если отбросить детали, разногласие сводится к одному компромиссу. Если давить на скорость, результатов будет больше, чем когда-либо, но растёт гора доказательств, которых никто не понимает. Если давить на понимание, математика остаётся человеческой, но большая часть новых возможностей остаётся неиспользованной. В долгосрочной перспективе цели сходятся: именно понимание позволяет задать следующий хороший вопрос. В краткосрочной они конкурируют за одних и тех же людей и одни и те же вычисления.'
      - Нейтрального положения нет. Выберите то, что ближе всего к вашему взгляду, и посмотрите, как проголосовали другие.
      understanding: Глубина понимания
      speed: Скорость прогресса
      gauges:
        speed: Темп открытий
        understanding: Общее понимание людей
        people: Сколько людей нужно науке
      figure: fig. 08 — выберите свой компромисс
      illustrative: Индикаторы условные
      results: Как проголосовали читатели
      results_figure: fig. 09 — голоса на данный момент
      live: Результаты в реальном времени
      states:
      - title: Каждая теорема — учебник
        body: Результаты проверяются и осмысливаются годами. Понимание глубокое, но прогресс идёт со скоростью поколений, как последние 300 лет.
      - title: Осторожное внедрение
        body: ИИ берёт на себя рутину и проверку, большие задачи остаются у людей. Темп растёт, но большая часть возможностей не используется.
      - title: Скорость и понимание вместе
        body: ИИ находит результаты, люди вместе с ИИ превращают их в методы, которые может освоить любой. Нужны новые нормы публикации и много людей, умеющих работать с результатами машин.
      - title: Ставка на прогресс
        body: 'Наука ускоряется во много раз: прорывы за одну жизнь, а не за несколько. Главным навыком становится выбор вопросов и разумная трата ограниченного compute. Это моя позиция.'
      - title: Только ответы
        body: Утверждения доказываются быстрее, чем их кто-то читает. Прогресс выглядит огромным, но всё больше результатов становятся чёрным ящиком, который некому проверить и развить.
      vote: Голосовать за эту позицию
