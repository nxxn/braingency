      votes:
        one: "%{count} голос"
        few: "%{count} голоса"
        many: "%{count} голосов"
        other: "%{count} голоса"
      first: 'Будьте первым: выберите позицию ползунком выше и проголосуйте.'
      saving: Сохраняем ваш голос…
      thanks: Спасибо, ваш голос учтён. Его можно изменить в любой момент.
      error: Не удалось сохранить голос. Попробуйте ещё раз чуть позже.
