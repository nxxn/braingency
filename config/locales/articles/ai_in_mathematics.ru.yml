    problems:
      heading: Знаменитые задачи
      sub: Каждая линия — сколько задача оставалась открытой. Отфильтруйте по тому, кто её закрыл, и откройте строку, чтобы прочитать историю.
      body:
      - Почему математиков так волнует дорога, а не только пункт назначения? Классический пример — теорема Ферма. Само утверждение практической пользы не имеет. Но в 1847 году Габриэль Ламе объявил доказательство, в котором незаметно предположил, что разложение на множители в расширенной системе чисел единственно. Это не так. Пытаясь закрыть пробел, Эрнст Куммер и Рихард Дедекинд изобрели идеалы, ставшие фундаментом современной алгебры. Век спустя путь к доказательству Уайлса прошёл через эллиптические кривые и модулярные формы, которые сейчас в центре одного из крупнейших проектов математики — программы Ленглендса.
      - 'Вот опасение в одной фразе: если бы машина в 1847 году просто объявила «теорема Ферма верна», изобрёл бы кто-нибудь идеалы? Оптимистичный ответ: хороший ИИ может выдавать идеи вместе с ответом. Будет ли он это делать, зависит от того, чему мы его научим.'
