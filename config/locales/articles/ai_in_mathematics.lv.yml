    intro:
    - 'Gandrīz visu vēsturi liela neatrisināta matemātikas problēma darbojās kā bāka. Matemātiķu paaudzes kuģoja tās virzienā un pa ceļam atklāja jaunus kontinentus: veselas matemātikas nozares, uz kurām galu galā balstās mūsdienu pasaule, no kriptogrāfijas līdz laika prognozēm.'
    - 2026. gada septembrī šis ritms salūza. OpenAI MI sistēma piedāvāja pierādījumu vienai no septiņām tūkstošgades problēmām. Tie ir grūtākie jautājumi, ko matemātiķi sev uzdeva gadsimtu mijā, un par katru ir solīts miljons dolāru. Nedēļas laikā divdesmit pieci Fīldsa medaļas laureāti, augstākās matemātikas balvas ieguvēji, publicēja brīdinājumu. Pēc mēneša OpenAI atbildēja ar publisku katalogu, kurā ir simtiem jaunu rezultātu.
    - 'Šajā rakstā mēs izskaidrojam, kas notika, par ko strīdas abas puses un kāpēc mēs braingency uzskatām, ka pareizā atbilde nav bremzēt, bet sagatavot daudz vairāk cilvēku, kas spēj strādāt kopā ar šīm mašīnām. Visi grafiki zemāk ir interaktīvi: pārslēdziet, filtrējiet un pāršķiriet tos. Beigās nobalsojiet paši.'
    timeline:
      heading: Piecas nedēļas, kas satricināja matemātiku
      sub: Pāršķiriet notikumus no 1. septembra līdz 2026. gada 6. oktobrim.
      body:
      - 'Navjē–Stoksa vienādojumi apraksta šķidrumu un gāzu kustību: gaisu virs spārna, asinis artērijā, laikapstākļus virs Atlantijas. Inženieri tos izmanto katru dienu. Tomēr gandrīz simts gadus neviens nespēja atbildēt uz vienkāršu jautājumu. Ja plūsma sākumā ir gluda, vai kādā brīdī ātrums var kļūt bezgalīgs? Matemātiķi to sauc par atrisinājuma „sprādzienu”. Ja tas ir iespējams, šajā punktā vienādojumi pārstāj aprakstīt realitāti.'
      - 'OpenAI sistēma atbildēja: jā. Tā konstruēja virpuli, kas griežas uz iekšu un izstiepjas kā spageti, kļūstot arvien ātrāks un tievāks, līdz galīgā laikā ātrums tā centrā kļūst bezgalīgs, kamēr kopējā enerģija paliek galīga.'
      - 'Rezultātu ir grūti noraidīt, pateicoties <strong>Lean</strong> — programmēšanas valodai, kurā katru pierādījuma soli pārbauda dators. Lean pierādījumā nevar paslēpt robu tā, kā 200 lappušu rakstā. Tikpat interesanti ir tas, kā pierādījums tika atrasts: nevis viens modelis domājot vienatnē, bet tūkstošiem MI aģentu, kas strādāja grupās, dalījās ar daļējām idejām un tika pārvirzīti uz daudzsološākajām pieejām.'
