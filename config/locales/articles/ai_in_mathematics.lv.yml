    debate:
      heading: Deklarācija un atbilde
      sub: Izvēlieties matemātiķu iebildumu un pārslēdzieties, lai redzētu, ko OpenAI atbildēja mēnesi vēlāk.
      body:
      - 'Deklarācija ar nosaukumu <em>A Severe Misalignment of AI in Mathematics</em> („Nopietna MI un matemātikas mērķu nesakritība”) ir īsa, bet tās parakstiem ir milzīgs svars: Terenss Tao, Pēters Šolce, Maksims Koncevičs, Marina Vjazovska, Pjērs Delinjs un vēl divdesmit Fīldsa medaļas laureāti, kuru medaļas aptver laiku no 1978. līdz 2026. gadam.'
      - 'Galvenais arguments ir vecs, bet jaunos apstākļos. Slavena problēma nekad netika vērtēta tikai atbildes dēļ. Tās vērtība bija tā, ka risinājums lika izgudrot jaunas idejas, kuras kopiena pēc tam gadiem ilgi apsprieda, vienkāršoja un mācīja, līdz tās kļuva par mācību grāmatu materiālu. Kad mašīna sniedz atbildi bez šī ceļa, signāls paliek, bet tas, ko tas agrāk signalizēja, var izzust. Ekonomisti to sauc par Gudharta likumu: kad rādītājs kļūst par mērķi, tas vairs nav labs rādītājs.'
      - 'Autori iebilst arī pret to, kā rezultāti tiek publicēti: ātri, bez pienācīga izklāsta un atsaucēm uz priekšgājējiem. Un viņi raizējas par studentiem, kuriem uzdevumus dod tieši tāpēc, lai viņi augtu, ar tiem cīnoties. To visu viņi redz kā priekšvēstnesi tam, ar ko saskarsies ikviena intelektuāla profesija.'
      after: 'Deklarācija neprasa aizliegt MI. Terenss Tao pats to izmanto katru dienu un drīz pēc deklarācijas rakstīja, ka matemātiķu būs vajadzīgs daudz vairāk, nevis mazāk. Strīds ir par to, kas nosaka mērķus: mārketinga nodaļas vai zinātniskā kopiena.'
