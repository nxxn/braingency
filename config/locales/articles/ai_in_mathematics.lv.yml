      verdicts:
        idle: Izvēlieties uzdevumus kreisajā pusē. Katrs maksā skaitļošanu; budžets ir fiksēts.
        headline: Skaļš virsraksts, bet būvēt uz tā gandrīz nav ko. Tieši par šo slazdu brīdina Fīldsa laureāti.
        volume: Daudz izvades, maz izpratnes. Apjoms nav progress.
        strong: 'Spēcīgs portfelis: jauni rezultāti un izpratne, kas vajadzīga nākamajiem jautājumiem.'
        mixed: Nav slikti. Mēģiniet apvienot atklājumus ar darbu, kas padara rezultātus saprotamus.
      after: Šeit mans skatījums un matemātiķu nostāja sakrīt. Prasme uzdot pareizos jautājumus un saprast atbildes kļūst par zinātnieka galveno prasmi. Es tikai redzu MI kā iemeslu attīstīt šo prasmi ātrāk, nevis kā draudus tai.
    freedom:
      heading: Brīvība un ceļš augšup
      sub: Divas idejas ārpus matemātikas, kas, manuprāt, izskaidro, kas patiesībā ir likts uz spēles.
      existentialists:
        eyebrow: Eksistenciālisti
        pull: Jo vairāk MI var izdarīt mūsu vietā, jo vairāk mums ir <em>brīvības</em> izvēlēties, par ko kļūt.
        body:
        - 'Eksistenciālisma filozofi visu 20. gadsimtu domāja par jautājumu, kas pēkšņi kļuvis praktisks. Kirkegors aprakstīja reiboni, ko cilvēks izjūt atvērtas iespējas priekšā. Sartrs rakstīja, ka mēs esam <strong>nolemti būt brīvi</strong>: nav noteiktas dabas vai scenārija, kas izlemj mūsu vietā, tāpēc katra izvēle ir mūsu, un arī atbildība par to.'
        - 'Lielāko vēstures daļu šo brīvību ierobežoja nepieciešamība. Dzīves gadi aizgāja aprēķiniem, pārrakstīšanai, pārbaudei un iegaumēšanai tikai tāpēc, ka kādam tas bija jādara. Jo vairāk šī darba pārņem MI, jo mazāk ir nepieciešamības, un eksistenciālistu jautājums kļūst par ikviena ikdienas jautājumu: <strong>ja mašīna to var izdarīt, ko izvēlos darīt es?</strong> Manuprāt, tieši šeit mēs tagad esam. Brīvība ir neizbēgama. Ko mēs ar to darīsim, ir atkarīgs no mums.'
      brodsky:
        eyebrow: Josifs Brodskis, Nobela lekcija, 1987
        pull: Nevis mākslai jārunā pūļa valodā, bet cilvēkiem jāiemācās runāt <em>mākslas valodā</em>.
        body:
        - Savā Nobela lekcijā Brodskis apgrieza ierastu prasību otrādi. Nevis literatūrai jānolaižas līdz masu ikdienas runai, bet tautai jāpaceļas līdz literatūras valodai. Es to saprotu kā nostāju pret mākslas vienkāršošanu plašākās auditorijas dēļ. Literatūrai, pēc Brodska domām, cilvēks jāpaceļ jaunā intelektuālā līmenī, nevis jāpielāgojas jau ierastajam runas un domāšanas līmenim.
        - 'Es uzskatu, ka tas pats attiecas uz MI. <strong>Vieglais ceļš ir izmantot to, lai paliktu tur, kur esam</strong>: mazāk domāt, mazāk rakstīt, mazāk saprast un ļaut mašīnai aizpildīt tukšumu. Daudz interesantāks un sabiedrībai un civilizācijai daudz noderīgāks ceļš ir ar tā palīdzību sasniegt jaunu līmeni gan sabiedrībai kopumā, gan katram cilvēkam atsevišķi.'
