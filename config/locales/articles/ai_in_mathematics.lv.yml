        quote: Nav laika pienācīgam izklāstam.
        mathematicians: Risinājumus paziņo, pirms kāds tos ir pienācīgi aprakstījis, izcēlis jaunās metodes vai apspriedis referātos un rakstos.
        openai: Tagad viss atrodas <strong>GitHub repozitorijā ar versiju vēsturi</strong> un labojumu kārtību, un OpenAI sola labāku izklāstu nākamajos laidienos. Taču 719 manuskripti vienlaikus joprojām ir daudz vairāk, nekā kopiena spēj ātri izlasīt.
