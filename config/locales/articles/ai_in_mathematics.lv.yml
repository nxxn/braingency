    problems:
      heading: Slavenās problēmas
      sub: Katra līnija rāda, cik ilgi problēma palika atvērta. Filtrējiet pēc tā, kas to atrisināja, un atveriet rindu, lai izlasītu stāstu.
      body:
      - Kāpēc matemātiķiem tik ļoti rūp ceļš, nevis tikai galamērķis? Klasisks piemērs ir Lielā Ferma teorēma. Pašam apgalvojumam nav praktiska pielietojuma. Taču 1847. gadā Gabriels Lamē paziņoja par pierādījumu, kurā nemanāmi pieņēma, ka sadalījums reizinātājos paplašinātā skaitļu sistēmā ir viennozīmīgs. Tas tā nav. Mēģinot aizlāpīt robu, Ernsts Kummers un Rihards Dedekinds izgudroja ideālus, kas kļuva par modernās algebras pamatu. Gadsimtu vēlāk ceļš uz Vailsa pierādījumu veda caur eliptiskajām līknēm un modulārajām formām, kas tagad ir viena no lielākajiem matemātikas projektiem — Langlendsa programmas — centrā.
      - 'Bažas vienā teikumā: ja mašīna 1847. gadā vienkārši būtu paziņojusi „Ferma teorēma ir patiesa”, vai kāds būtu izgudrojis ideālus? Optimistiskā atbilde: labs MI var sniegt idejas kopā ar atbildi. Vai tas tā darīs, ir atkarīgs no tā, ko mēs to iemācīsim sniegt.'
