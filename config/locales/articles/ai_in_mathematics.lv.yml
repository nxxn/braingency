    poll:
      heading: Kāda ir jūsu nostāja?
      sub: Viss strīds ir par to, ko mēs maksimizējam. Pabīdiet slīdni, lai izpētītu katru nostāju, un nobalsojiet.
      body:
      - 'Ja atmet detaļas, nesaskaņas ir par vienu kompromisu. Ja spiež uz ātrumu, rezultātu būs vairāk nekā jebkad, bet aug kaudze pierādījumu, kurus neviens nesaprot. Ja spiež uz izpratni, matemātika paliek cilvēciska, bet lielākā daļa jauno iespēju paliek neizmantota. Ilgtermiņā mērķi saplūst: tieši izpratne ļauj uzdot nākamo labo jautājumu. Īstermiņā tie sacenšas par tiem pašiem cilvēkiem un to pašu skaitļošanas jaudu.'
      - Neitrālas pozīcijas nav. Izvēlieties to, kas vistuvāk jūsu skatījumam, un paskatieties, kā balsoja citi.
