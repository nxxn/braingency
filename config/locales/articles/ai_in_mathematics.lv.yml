      sub: Zinātne transformēsies un paātrināsies. Tieši tāpēc mums kā nekad vajag vairāk zinātnieku visās jomās, lai to virzītu uz priekšu.
      pull: MI izlīdzina iespējas. Vairs nav jātērē <em>simtiem tūkstošu</em> elitārai izglītībai, ja tu esi spējīgs un proti uzdot jautājumus.
      body: 'Drīz šie modeļi būs pieejami visiem. Students mazā pilsētā turēs rokās instrumentu, kas vēl vakar bija tikai labākajām pasaules laboratorijām. Talants vairs nav atkarīgs no tā, kur tu esi dzimis un cik maksāja tavs diploms. Matemātika, fizika, bioloģija, medicīna, materiālzinātne: katrai jomai būs vajadzīgi cilvēki, kas uzdod jautājumus, vada mašīnas un pārvērš rezultātus tehnoloģijās, zālēs un jaunās zināšanās.'
