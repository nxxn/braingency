        verdict: ok
        verdict_text: Ņemts vērā
        quote: Jauna rezultāta pārbaude cilvēkiem aizņem mēnešus un gadus.
        mathematicians: Liela pierādījuma cilvēciska pārbaude ir lēna, un kļūdas var slēpties simtiem lappušu.
        openai: Apmēram <strong>42% galveno rezultātu ir formalizēti Lean</strong>, tas nozīmē, ka katru soli pārbaudīja dators. Par pārējiem OpenAI atklāti raksta, ka tajos var būt kļūdas, un tās tiks labotas.
      - title: Autorība un plaģiāts
        verdict: ok
        verdict_text: Ņemts vērā
        quote: Kam pienākas nopelns un uz kā darba tas balstās?
        mathematicians: Kā jebkurā radošā profesijā, steidzīgi MI rezultāti rada sarežģītus autorības jautājumus un jautājumus par atsaucēm uz tiem, kuru idejas bija pirmās.
        openai: Katram manuskriptam tagad ir <strong>citēšanas norādījumi</strong>. Eilera gadījumā OpenAI publiski atzina citas komandas prioritāti. Uzņēmums arī konsultējas ar neatkarīgu padomdevēju grupu Prinstonas Padziļināto pētījumu institūtā.
      - title: Zināšanu nodošanas ķēde
        verdict: part
        verdict_text: Daļēji
        quote: Idejas atdzīvojas tikai tad, kad tās nes cilvēki.
        mathematicians: Bez matemātiķiem, kas iekļauj MI idejas zinātnē, šīs idejas nekad pilnībā neatdzīvosies, un ķēde no skolotāja līdz skolēnam pārtrūks.
        openai: OpenAI <strong>finansēs darbnīcas, konferences un programmas</strong> MI rezultātu izpratnei un publicēja modeļa spriedumu kopsavilkumus desmit rezultātiem, lai varētu izsekot tā ceļam.
      - title: Kas notiks ar studentiem?
        verdict: 'no'
        verdict_text: Nav atbildes
        quote: Mēs dodam studentiem uzdevumus, lai viņi augtu.
        mathematicians: Uzdevumi studentiem ir vajadzīgi, lai attīstītu prasmes un briedumu. Ja atbildes nāk par velti, šis treniņš izzūd.
        openai: OpenAI publikācijā <strong>nav tiešas atbildes</strong>. Manuprāt, tas ir svarīgākais atvērtais jautājums, un uz to mēģina atbildēt visa atlikusī raksta daļa.
    scale:
      heading: Cilvēki un MI vienā skalā
      sub: Pārslēdzieties starp pierādījuma atrašanu un pārbaudi. Pēc tam ieslēdziet lineāro skalu un vērojiet, kā MI stabiņi gandrīz pazūd.
      body:
      - Matemātiskam rezultātam ir divas cenas. Vispirms kādam jāatrod pierādījums. Pēc tam visiem pārējiem jāpārliecinās, ka tas ir pareizs. Cilvēkiem abi soļi ir lēni. Endrjū Vailss gandrīz viens pats septiņus gadus strādāja pie Ferma teorēmas. Kad Grigorijs Perelmans publicēja Puankarē hipotēzes pierādījumu, vairākām ekspertu grupām vajadzēja apmēram trīs gadus, lai to apstiprinātu. Tomasa Heilsa datorizēto Keplera hipotēzes pierādījumu bija tik grūti recenzēt, ka viņš uzsāka formālas pārbaudes projektu, un tas aizņēma vēl vienpadsmit gadus.
      - 'MI maina abus skaitļus vienlaikus. Grafiks zemāk tos novieto blakus. Pēc noklusējuma skala ir logaritmiska: katrs iedaļas solis ir desmit reizes lielāks par iepriekšējo. Tikai tā stundas un gadu desmiti ietilpst vienā līnijā.'
      after: 'Salīdzinājums nav pilnīgi godīgs: modelis stāv uz visu iepriekšējo matemātiķu pleciem. Taču mēroga maiņa ir reāla. 26 gados kopš tūkstošgades problēmu izsludināšanas cilvēki atrisināja tieši vienu — Puankarē hipotēzi. Tikai OpenAI katalogā vien tagad ir <strong>719 manuskripti 372 saimēs</strong>, kas iegūti no aptuveni 4000 uzdotām problēmām, vidēji ap trim skaitļošanas stundām uz rezultātu. Apmēram 42% galveno rezultātu ir formāli pārbaudīti Lean.'
