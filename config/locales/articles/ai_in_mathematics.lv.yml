      budget_heading: 'Jaunā prasme: maksimāls progress uz skaitļošanas vienību'
      budget_body: 'Skaitļošanas jauda paliks ierobežota un dārga. Tikai Navjē–Stoksa uzdevumam vien vajadzēja miljoniem ziņojumu starp aģentiem. Nākotnes zinātnieks izlemj, kuru jautājumu uzdot pirmo, kur tērēt budžetu un kurš rezultāts ir pelnījis dziļu izpratni. Pamēģiniet: jums ir <strong>100 skaitļošanas vienības</strong>. Izveidojiet savu pētniecības portfeli.'
