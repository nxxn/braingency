      items:
      - name: Keplera hipotēze
        story: Cik blīvi var sapakot lodes? Tomass Heilss pierādīja Keplera minējumu 1998. gadā ar lielu datora palīdzību. Pilna formālā pārbaude (Flyspeck) ilga līdz 2014. gadam.
      - name: Ferma teorēma
        story: Endrjū Vailss gandrīz viens pats pie tās strādāja septiņus gadus. Pa ceļam matemātika ieguva ideālu teoriju 19. gadsimtā un modularitātes metodes 20. gadsimtā.
      - name: Četru krāsu teorēma
        story: Apela un Hakena pierādījums bija pirmā lielā teorēma, kas balstījās uz datoru, un izraisīja gadiem ilgus strīdus par to, ko uzskatīt par pierādījumu.
      - name: Rīmaņa hipotēze
        story: Joprojām atvērta. OpenAI ziņo par apgabalu bez nullēm, kur Re(s) > 11/12. Tā nav pati hipotēze, bet, ja rezultāts apstiprināsies, šāda josla pierādīta pirmo reizi.
      - name: Puankarē hipotēze
        story: Grigorija Perelmana pierādījums ir vienīgā cilvēku atrisinātā tūkstošgades problēma. Viņš atteicās gan no Fīldsa medaļas, gan no $1 milj. balvas.
      - name: Navjē–Stokss
        story: Atvērta kopš Lerē 1934. gada darba. OpenAI aģenti parādīja, ka gluda plūsma var „uzsprāgt” galīgā laikā. Pierādījums formalizēts Lean; uz balvu OpenAI nepretendē.
      - name: Mālera hipotēze
        story: Jautājums par izliekta ķermeņa un tā duālā ķermeņa tilpumu minimālo reizinājumu. Iekļauta OpenAI rezultātos, publicēts modeļa spriedumu kopsavilkums.
      - name: Brīvo grupu faktori
        story: Vai dažādi brīvo grupu faktori ir izomorfi — centrāls operatoru algebru jautājums kopš Mareja un fon Neimana laikiem. OpenAI to iekļauj savos rezultātos.
      - name: Hodža hipotēze
        story: Vispārīgā veidā joprojām atvērta. OpenAI ziņo par pierādījumu svarīgam speciālgadījumam — ābela varietātēm ar kompleksu reizināšanu.
    professions:
      heading: Profesijas vienmēr ir mainījušās
      sub: Es 13 gadus mācīju matemātiku. Es saprotu šīs bažas. Bet es uz to raugos citādi.
      pull: Ja zinātnes mērķis ir virzīt civilizāciju uz priekšu, tad <em>rezultātu iegūšanas ātrumam</em> ir milzīga nozīme.
      body:
      - Jo ātrāk mēs iegūstam atbildes, jo ātrāk varam uzdot nākamos jautājumus. Pirmo reizi izrāviens, kam agrāk vajadzēja vairākas paaudzes, var ietilpt <strong>vienā cilvēka mūžā</strong>. Atteikties no tā ierasto paradumu dēļ man šķiet nepareizi.
      - 'Tam ir gājusi cauri katra profesija. Katram cilvēkam tajā brīdī pielāgoties bija grūti. Taču kopā šīs pārmaiņas uzbūvēja pasauli, kas ir daudz labāka par iepriekšējo. Tāpēc es mainītu prioritāti: nevis sargāt apstākļus, kuros gadu desmitiem nekas nemainās, bet mācīties ātri pielāgoties un pārbūvēt savu darbu.'
      - Klasē es sapratu galveno. <strong>Mēs nekad nemācījām atbildes dēļ uzdevumu krājuma beigās. Mēs mācījām cilvēkiem domāt.</strong> Tieši tāpēc MI mani nebiedē. Tas neatceļ domāšanu. Tas paceļ to jaunā līmenī.
