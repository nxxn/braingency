    problems:
      heading: Famous problems explorer
      sub: Each line is how long a problem stayed open. Filter by who closed it, and open a row for the story.
      body:
      - Why do mathematicians care so much about the road and not just the destination? Fermat's Last Theorem is the classic example. The statement itself has no practical use. But in 1847 Gabriel Lamé announced a proof that quietly assumed numbers factor uniquely in a larger number system. They don't. Trying to repair the gap, Ernst Kummer and Richard Dedekind invented ideals, which became the foundation of modern algebra. A century later, the route to Wiles's proof ran through elliptic curves and modular forms, now central to one of the largest projects in mathematics, the Langlands programme.
      - 'That is the fear in one sentence: if a machine had simply announced "Fermat is true" in 1847, would anyone have invented ideals? The optimistic answer is that a good AI can produce the ideas along with the answer. Whether it does depends on what we train it to deliver.'
