      states:
      - title: Every theorem a textbook
        body: Results are checked and digested for years. Understanding is deep, but progress moves at the speed of generations, as it has for 300 years.
      - title: Careful adoption
        body: AI handles routine work and checking, people keep the big problems. The pace rises, but most of the opportunity goes unused.
      - title: Speed and understanding together
        body: AI finds results, people and AI turn them into methods anyone can learn. It needs new publishing norms and many people trained to work with machine results.
      - title: Bet on progress
        body: 'Science accelerates many times over: breakthroughs within one lifetime instead of several. The key skill becomes choosing questions and spending limited compute wisely. This is my position.'
      - title: Answers only
        body: Statements get proven faster than anyone reads them. Progress looks huge, but more and more becomes a black box nobody can check or build on.
