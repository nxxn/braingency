    debate:
      heading: The declaration and the reply
      sub: Pick a concern raised by the mathematicians, then switch sides to see how OpenAI answered it a month later.
      body:
      - 'The declaration, titled <em>A Severe Misalignment of AI in Mathematics</em>, is short, and its signatures carry enormous weight: Terence Tao, Peter Scholze, Maxim Kontsevich, Maryna Viazovska, Pierre Deligne and twenty more Fields Medallists, spanning medals from 1978 to 2026.'
      - 'Their central argument is an old one in a new setting. A famous problem was never valued for its answer alone. Its value was that solving it forced someone to invent new ideas, which the community then spent years discussing, simplifying and teaching until they became textbook material. When a machine produces the answer without that journey, the signal stays, but the thing it used to signal may be gone. Economists call this Goodhart''s law: when a measure becomes a target, it stops being a good measure.'
      - 'The authors also object to how results are released: announced quickly, without proper write-ups or credit to earlier work. And they worry about students, who are given problems precisely so that they grow by struggling with them. They frame all of this as a preview of what every intellectual profession will face.'
      after: 'The declaration does not ask to ban AI. Terence Tao uses it daily and shortly afterwards wrote that mathematics will need many more mathematicians, not fewer. The argument is about who sets the goals: marketing departments or the research community.'
      side_mathematicians: Mathematicians said
      side_openai: OpenAI replied
      who:
      - Fields Medallists
      - OpenAI, Oct 6
      figure: fig. 02 — concern in, response out
      note: Verdicts are our reading
      claims:
      - title: Results are announced in a rush
        verdict: part
        verdict_text: Partly met
        quote: No time for a proper write-up.
        mathematicians: Solutions are announced before anyone has written them up properly, isolated the new methods, or digested them through talks and papers.
        openai: Everything now sits in a <strong>versioned GitHub repository</strong> with a revision protocol, and OpenAI promises better exposition in future releases. But 719 manuscripts at once is still far more than the community can read quickly.
      - title: Can we trust the proofs?
        verdict: ok
        verdict_text: Addressed
        quote: Checking a new result takes people months or years.
        mathematicians: Human verification of a major proof is slow, and errors can hide in hundreds of pages.
        openai: About <strong>42% of headline results are formalized in Lean</strong>, which means a computer checked every step. For the rest, OpenAI says plainly that they may contain errors and will be fixed.
      - title: Attribution and plagiarism
        verdict: ok
        verdict_text: Addressed
        quote: Who gets credit, and whose work was built on?
        mathematicians: As in every creative profession, rushed AI results raise hard questions of attribution and of citing the people whose ideas came first.
        openai: Each manuscript now has <strong>citation instructions</strong>. In the Euler case OpenAI publicly credited another team's priority. It also consults an independent advisory group at the Institute for Advanced Study.
      - title: The human chain of knowledge
        verdict: part
        verdict_text: Partly met
        quote: Ideas only come alive when people carry them.
        mathematicians: Without mathematicians who absorb AI ideas into the canon, those ideas never fully live, and the chain from teacher to student breaks.
        openai: OpenAI will <strong>fund workshops, conferences and programmes</strong> on understanding AI results, and published reasoning summaries for ten results so people can follow the model's path.
      - title: What happens to students?
        verdict: 'no'
        verdict_text: No answer
        quote: We give students problems so that they grow.
        mathematicians: Problems for students exist to build skill and maturity. If answers come for free, that training disappears.
        openai: There is <strong>no direct answer</strong> in OpenAI's release. In my view this is the most important open question, and the one the rest of this article tries to answer.
    scale:
      heading: Humans vs AI, on one scale
      sub: Switch between finding and verifying a proof. Then flip the scale to linear and watch the AI bars all but disappear.
      body:
      - A mathematical result has two costs. First someone has to find the proof. Then everyone else has to be convinced it is correct. For humans both steps are slow. Andrew Wiles spent seven years largely alone on Fermat's Last Theorem. When Grigori Perelman posted his proof of the Poincaré conjecture, several teams of experts needed about three years to confirm it. Thomas Hales's computer-assisted proof of the Kepler conjecture was so hard to referee that he launched a project to check it formally, and that took eleven more years.
      - AI changes both numbers at once. The chart below puts them side by side. The default view uses a logarithmic scale, where each grid step is ten times longer than the one before; it is the only way hours and decades fit on the same line.
      after: 'The comparison is not entirely fair: the model stands on the shoulders of every mathematician before it. But the shift in scale is real. In the 26 years since the Millennium Prize Problems were announced, humans solved exactly one, the Poincaré conjecture. OpenAI''s catalogue alone now holds <strong>719 manuscripts in 372 families</strong>, produced from roughly 4,000 posed problems, at about three hours of compute per result. Around 42% of the headline results are formally checked in Lean.'
