    poll:
      heading: Where do you stand?
      sub: The whole debate comes down to what we maximise. Move the slider to explore each position, then cast your vote.
      body:
      - 'Strip away the details and the disagreement is about a single trade-off. Push hard for speed and we get more results than ever, but risk a growing pile of proofs nobody understands. Push hard for understanding and we keep mathematics human, but leave most of the new capability on the table. In the long run the two goals converge: understanding is what lets us ask the next good question. In the short run they compete for the same people and the same compute.'
      - There is no neutral setting. Pick the one closest to your view and see how others voted.
