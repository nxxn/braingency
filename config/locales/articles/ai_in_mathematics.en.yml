      verdicts:
        idle: Select tasks on the left. Each one costs compute; the budget is fixed.
        headline: A big headline, but little anyone can build on. This is the trap the Fields Medallists warn about.
        volume: Lots of output, little insight. Volume is not progress.
        strong: 'A strong portfolio: new results plus the understanding needed to ask the next questions.'
        mixed: Not bad. Try mixing discovery with work that makes results understandable.
      after: Here my view and the mathematicians' meet. Asking the right questions and understanding the answers becomes the core skill of a scientist. I just see AI as the reason to build that skill faster, not as a threat to it.
    freedom:
      heading: Freedom and the higher path
      sub: Two ideas from outside mathematics that, I think, explain what is really at stake.
      existentialists:
        eyebrow: The existentialists
        pull: The more AI can do for us, the more <em>freedom</em> we have to choose who we become.
        body:
        - 'Existentialist philosophers spent the twentieth century on a question that suddenly feels practical. Kierkegaard described the dizziness a person feels when facing open possibility. Sartre wrote that we are <strong>condemned to be free</strong>: there is no fixed nature or script that decides for us, so every choice is ours, and so is the responsibility for it.'
        - 'For most of history that freedom was limited by necessity. Years of a life went into computing, copying, checking and remembering, simply because someone had to. As AI takes over more of that work, necessity shrinks and the question the existentialists asked becomes everyone''s daily question: <strong>now that the machine can do this, what do I choose to do?</strong> I think this is exactly where we are now. The freedom is unavoidable. What we do with it is up to us.'
      brodsky:
        eyebrow: Joseph Brodsky, Nobel Lecture, 1987
        pull: Not art that speaks the language of the crowd, but people who learn to speak the <em>language of art</em>.
        body:
        - In his Nobel lecture Brodsky turned a familiar demand around. It is not literature that should come down to the everyday speech of the masses; it is people who should rise to the language of literature. I read this as a stand against simplifying art for the widest audience. Literature, for Brodsky, should lift a person to a new intellectual level rather than adapt to the level of speech and thinking they already have.
        - 'I believe the same is true of AI. <strong>The easy path is to use it to stay where we are</strong>: to think less, write less, understand less, and let the machine fill the gap. The far more interesting path, and the far more useful one for society and civilisation, is to use it to reach a new level, both as a society and as individual people.'
