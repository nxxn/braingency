    scientists:
      heading: We need more scientists, not fewer
      sub: Science will transform and accelerate. That is exactly why we need more scientists across every field to push it forward.
      pull: AI levels the field. You no longer need <em>hundreds of thousands</em> spent on an elite education if you are capable and know how to ask questions.
      body: 'These models will soon be available to everyone. A student in a small town will hold a tool that only the best labs in the world had yesterday. Talent stops depending on where you were born and what your diploma cost. Mathematics, physics, biology, medicine, materials science: every field will need people who ask the questions, steer the machines and turn results into technologies, medicines and new knowledge.'
