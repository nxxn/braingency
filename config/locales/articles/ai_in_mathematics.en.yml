      items:
      - name: Kepler conjecture
        story: How densely can spheres be packed? Thomas Hales proved Kepler's guess with heavy computer help in 1998. A full formal check (Flyspeck) took until 2014.
      - name: Fermat's Last Theorem
        story: Andrew Wiles worked on it largely alone for seven years. Along the way mathematics gained ideal theory in the 19th century and modularity methods in the 20th.
      - name: Four colour theorem
        story: Appel and Haken's proof was the first major theorem to rely on a computer, and caused years of debate about what counts as a proof.
      - name: Riemann hypothesis
        story: Still open. OpenAI reports a zero-free region for Re(s) > 11/12. That is not the hypothesis itself, but if it holds up, it is the first strip of its kind ever proven.
      - name: Poincaré conjecture
        story: Grigori Perelman's proof is the only Millennium Problem solved by humans. He declined both the Fields Medal and the $1 M prize.
      - name: Navier–Stokes
        story: Open since Leray's 1934 work. OpenAI's agents showed a smooth flow can blow up in finite time. The proof is formalized in Lean; OpenAI does not claim the prize.
      - name: Mahler conjecture
        story: A question about the smallest volume product of a convex body and its dual. Listed among OpenAI's results, with a published summary of the model's reasoning.
      - name: Free group factors
        story: Whether different free group factors are isomorphic has been a central question in operator algebras since the era of Murray and von Neumann. OpenAI lists it among its results.
      - name: Hodge conjecture
        story: 'Still open in general. OpenAI reports a proof for an important special case: CM abelian varieties.'
    professions:
      heading: Professions have always changed
      sub: I taught mathematics for 13 years. I understand the worry. I see it differently.
      pull: If the goal of science is to move civilisation forward, then <em>speed of results</em> matters enormously.
      body:
      - The faster we get answers, the faster we can ask the next questions. For the first time, a breakthrough that once took several generations may fit into <strong>a single human lifetime</strong>. Turning that down to keep familiar routines feels wrong to me.
      - 'Every profession has been through this. For each person, adapting in the moment was hard. Together, those changes built a world that is far better than the one before. So I would shift the priority: not protecting conditions where nothing changes for decades, but learning to adapt fast and rebuild how we work.'
      - In the classroom I learned the main thing. <strong>We never taught for the answer at the back of the book. We taught people to think.</strong> That is exactly why AI does not scare me. It does not cancel thinking. It raises it to a new level.
