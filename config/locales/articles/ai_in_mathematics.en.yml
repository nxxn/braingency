    intro:
    - 'For most of history, a great unsolved problem in mathematics worked like a lighthouse. Generations of mathematicians sailed towards it, and on the way they discovered new continents: whole branches of mathematics that ended up running the modern world, from cryptography to weather forecasts.'
    - In September 2026 that rhythm broke. An AI system from OpenAI produced a proof for one of the seven Millennium Prize Problems, the hardest questions mathematicians set themselves at the turn of the century, each carrying a one-million-dollar reward. Within a week, twenty-five Fields Medallists, holders of the highest prize in mathematics, published a warning. A month later OpenAI answered with a public catalogue of hundreds of new results.
    - 'This article walks through what happened, what each side is arguing, and why we at braingency think the right response is not to slow down, but to train far more people who can work alongside these machines. Every figure below is interactive: switch, filter and step through it. At the end, cast your own vote.'
    timeline:
      heading: Five weeks that shook mathematics
      sub: Step through what happened between September 1 and October 6, 2026.
      body:
      - 'The Navier–Stokes equations describe how fluids move: air over a wing, blood in an artery, weather over the Atlantic. Engineers use them every day. Yet for almost a century nobody could answer a basic question about them. If a fluid starts out smooth, can the equations ever produce a moment where the speed becomes infinite? Mathematicians call that a blow-up. If it happens, the equations stop describing reality at that point.'
      - OpenAI's system answered yes. It built a swirling vortex that spirals inwards and stretches like spaghetti, getting faster and thinner until, in finite time, the velocity at its centre becomes infinite while the total energy stays finite.
      - 'What made the result hard to dismiss is <strong>Lean</strong>, a programming language in which every step of a proof is checked by a computer. A Lean proof cannot hide a gap the way a 200-page paper can. Just as notable is how the proof was found: not by one model thinking alone, but by thousands of AI agents working in groups, sharing partial ideas and being redirected as promising approaches emerged.'
