- slug: keeping-scoring-models-honest
  published_on: '2026-09-24'
  published: true
  title_en: What it takes to keep a scoring model honest in production
  excerpt_en: Training a credit scoring model is the visible part of the work. Whether it stays useful is decided after it starts approving real loans.
  body_en: |-
    Training a credit scoring model is the visible part of the work. The part that decides whether it stays useful starts the day it begins approving real applications.

    The first problem is drift. A model learns the relationship between applicants and outcomes as it was in the training data. Products change, marketing brings in different customers, the economy moves. The model keeps producing confident scores regardless, so the only defence is to watch it: compare the scores it produces today with those it produced when it was validated, and track outcomes as loans mature.

    The second is that outcomes arrive late, and only for some. Whether a loan was a good decision is known months after it was made, and only for applicants who were approved. A model that never learns what happened to the people it declined can drift towards its own blind spots, so monitoring has to account for that rather than treating the approved book as the whole truth.

    The third is accountability. In a regulated business every automated decision has to be explainable afterwards: which model version scored the application, with which inputs, against which threshold. That is an engineering requirement as much as a data science one — the score has to be recorded in the audit trail as part of the same step that acts on it.

    None of this is exotic. It is the difference between a model that was accurate once and a model a lender can keep relying on — and it is why we build scoring into the lending platform itself rather than bolting it on from outside.
  meta_title_en: Keeping a scoring model honest in production — Braingency
  meta_description_en: Training a credit scoring model is the visible part. Drift, late outcomes and accountability decide whether it stays useful once it approves real loans.
  title_lv: Kas vajadzīgs, lai kredītnovērtēšanas modelis ražošanā paliktu godīgs
  title_ru: Что нужно, чтобы скоринговая модель оставалась честной в эксплуатации
  excerpt_lv: Kredītnovērtēšanas modeļa apmācība ir redzamā darba daļa. Vai tas paliek noderīgs, izšķiras pēc tam, kad tas sāk apstiprināt reālus kredītus.
  excerpt_ru: Обучение модели кредитного скоринга — видимая часть работы. Останется ли она полезной, решается после того, как она начинает одобрять реальные кредиты.
  body_lv: |-
    Kredītnovērtēšanas modeļa apmācība ir redzamā darba daļa. Tā daļa, kas nosaka, vai modelis paliek noderīgs, sākas dienā, kad tas sāk apstiprināt reālus pieteikumus.

    Pirmā problēma ir nobīde. Modelis apgūst saikni starp pieteicējiem un iznākumiem tādu, kāda tā bija mācību datos. Produkti mainās, mārketings piesaista citus klientus, ekonomika mainās. Modelis jebkurā gadījumā turpina izdot pārliecinošus vērtējumus, tāpēc vienīgā aizsardzība ir to uzraudzīt: salīdzināt šodienas vērtējumus ar tiem, ko tas izdeva validācijas laikā, un sekot iznākumiem, kredītiem nobriestot.

    Otrā — iznākumi kļūst zināmi vēlu un tikai daļai. Vai kredīts bija labs lēmums, kļūst zināms mēnešus vēlāk un tikai par apstiprinātajiem pieteicējiem. Modelis, kas nekad neuzzina, kas notika ar tiem, kuriem tas atteica, var novirzīties uz saviem aklajiem punktiem, tāpēc uzraudzībai tas jāņem vērā, nevis jāuzskata apstiprinātais portfelis par visu patiesību.

    Trešā ir atbildība. Regulētā biznesā katram automatizētam lēmumam jābūt izskaidrojamam arī vēlāk: kura modeļa versija novērtēja pieteikumu, ar kādiem ievaddatiem un pret kādu slieksni. Tā ir tikpat liela inženiertehniska prasība kā datu zinātnes prasība — vērtējumam jābūt ierakstītam audita pierakstā tajā pašā solī, kurā uz to balstās lēmums.

    Nekas no tā nav eksotisks. Tā ir atšķirība starp modeli, kas reiz bija precīzs, un modeli, uz kuru kreditētājs var turpināt paļauties — un tieši tāpēc mēs iebūvējam novērtēšanu pašā kreditēšanas platformā, nevis pievienojam to no ārpuses.
  body_ru: |-
    Обучение модели кредитного скоринга — видимая часть работы. Та часть, от которой зависит, останется ли модель полезной, начинается в день, когда она начинает одобрять реальные заявки.

    Первая проблема — дрейф. Модель усваивает связь между заёмщиками и исходами такой, какой она была в обучающих данных. Продукты меняются, маркетинг приводит других клиентов, экономика не стоит на месте. А модель продолжает уверенно выдавать оценки, поэтому единственная защита — наблюдать за ней: сравнивать сегодняшние оценки с теми, что она выдавала при валидации, и отслеживать исходы по мере того, как кредиты вызревают.

    Вторая — исходы становятся известны поздно и только для части заявок. Было ли решение по кредиту удачным, выясняется через месяцы и только для одобренных заёмщиков. Модель, которая так и не узнаёт, что стало с теми, кому она отказала, может смещаться в сторону собственных слепых зон, поэтому мониторинг должен это учитывать, а не считать одобренный портфель всей правдой.

    Третья — подотчётность. В регулируемом бизнесе каждое автоматическое решение должно быть объяснимо и задним числом: какая версия модели оценила заявку, на каких входных данных и относительно какого порога. Это такое же инженерное требование, как и требование data science: оценка должна записываться в журнал аудита в рамках того же шага, на котором по ней принимается решение.

    Ничего экзотического здесь нет. В этом разница между моделью, которая когда-то была точной, и моделью, на которую кредитор может полагаться и дальше, — и именно поэтому мы встраиваем скоринг в саму кредитную платформу, а не прикручиваем его снаружи.
  meta_title_lv: Kā saglabāt kredītnovērtēšanas modeli godīgu ražošanā — Braingency
  meta_title_ru: Как сохранить честность скоринговой модели в эксплуатации — Braingency
