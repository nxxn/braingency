  meta_description_ru: Наша модель машинного обучения для оценки недвижимости работает в промышленной эксплуатации в Латвии, и мы расширяем её на Испанию.
- slug: one-platform-not-five-tools
  published_on: '2026-08-12'
  published: true
  title_en: Why we build lending systems as one platform, not five tools
  excerpt_en: Each tool in an assembled lending stack works. The problem is everything between them — and the data that gets scattered across systems that cannot see each other.
  body_en: |-
    Most lending businesses run on an assembled stack: one system for applications, another for scoring, a third for compliance checks, a spreadsheet for the portfolio, and something improvised for collections. Each tool works. The problem is everything between them.

    Data gets re-entered. Reconciliation becomes a job. When a regulator asks how a specific decision was made, the answer has to be reconstructed from four sources. And the most valuable asset the business has — the accumulated record of who applied, what was decided, and what happened next — is scattered across systems that cannot see each other.

    That last point is what changed our approach. A lender's own portfolio history is the best possible training data for a scoring model. But it is only usable if the application, the decision, the contract and the repayment record all live in the same place and can be joined. When we build the full lending cycle as one platform, the data stream becomes coherent by design — and the machine learning stops being a separate project and becomes a feature of the system.

    This is the reasoning behind our lending ERP platform, now running with clients in Latvia, Spain and the UAE.
  meta_title_en: Why we build lending systems as one platform — Braingency
  meta_description_en: Most lending businesses run on an assembled stack. Each tool works; the problem is everything between them. Why we build the full cycle as one system.
  title_lv: Kāpēc mēs veidojam kreditēšanas sistēmas kā vienu platformu, nevis pieciem rīkiem
  title_ru: Почему мы строим кредитные системы как одну платформу, а не пять инструментов
  excerpt_lv: Katrs rīks saliktā kreditēšanas sistēmu kopumā darbojas. Problēma ir viss, kas atrodas starp tiem — un dati, kas izkaisīti pa sistēmām, kuras viena otru neredz.
  excerpt_ru: Каждый инструмент в собранном по частям кредитном стеке работает. Проблема — всё, что между ними, и данные, разбросанные по системам, которые не видят друг друга.
  body_lv: |-
    Lielākā daļa kreditēšanas uzņēmumu strādā ar salikto rīku kopumu: viena sistēma pieteikumiem, cita skoringam, trešā atbilstības pārbaudēm, izklājlapa portfelim un kaut kas improvizēts parādu piedziņai. Katrs rīks darbojas. Problēma ir viss, kas atrodas starp tiem.

    Dati tiek ievadīti atkārtoti. Saskaņošana kļūst par atsevišķu darbu. Kad regulators jautā, kā tika pieņemts konkrēts lēmums, atbilde jāsaliek kopā no četriem avotiem. Un vērtīgākais aktīvs, kas uzņēmumam ir — uzkrātais ieraksts par to, kas pieteicās, kas tika izlemts un kas notika pēc tam — ir izkaisīts pa sistēmām, kuras viena otru neredz.

    Tieši šis pēdējais punkts mainīja mūsu pieeju. Kreditētāja paša portfeļa vēsture ir labākie iespējamie apmācības dati skoringa modelim. Bet tie ir izmantojami tikai tad, ja pieteikums, lēmums, līgums un atmaksas ieraksts atrodas vienuviet un ir savienojami. Kad mēs veidojam visu kreditēšanas ciklu kā vienu platformu, datu plūsma jau pēc būtības kļūst saskaņota — un mašīnmācīšanās pārstāj būt atsevišķs projekts un kļūst par sistēmas funkciju.

    Tāda ir loģika aiz mūsu kreditēšanas ERP platformas, kas tagad darbojas ar klientiem Latvijā, Spānijā un AAE.
  body_ru: |-
    Большинство кредитных компаний работают на стеке, собранном по частям: одна система для заявок, другая для скоринга, третья для проверок комплаенса, таблица для портфеля и что-то самодельное для взыскания. Каждый инструмент работает. Проблема — всё, что между ними.

    Данные вводятся повторно. Сверка превращается в отдельную работу. Когда регулятор спрашивает, как было принято конкретное решение, ответ приходится восстанавливать по четырём источникам. А самый ценный актив компании — накопленная история о том, кто подавал заявку, какое решение было принято и что произошло дальше, — разбросан по системам, которые не видят друг друга.

    Именно последний пункт изменил наш подход. Собственная история портфеля кредитора — лучшие обучающие данные для скоринговой модели, какие только можно получить. Но использовать их можно, только если заявка, решение, договор и история погашений хранятся в одном месте и могут быть связаны между собой. Когда мы строим весь кредитный цикл как одну платформу, поток данных согласован по самой конструкции — и машинное обучение перестаёт быть отдельным проектом и становится функцией системы.

    Такова логика нашей кредитной ERP-платформы, которая сейчас работает у клиентов в Латвии, Испании и ОАЭ.
