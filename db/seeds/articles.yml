- slug: verteo-property-valuation-ml
  published_on: '2026-07-29'
  published: true
  title_en: 'Verteo: forecasting Latvian property values with machine learning'
  excerpt_en: In a small market, comparable transactions are scarce and the data that does exist is fragmented. Verteo turns collateral valuation from a bottleneck into part of the decision.
  body_en: |-
    Property valuation in a small market is a hard problem. There are fewer comparable transactions than in a large market, prices vary sharply by micro-location, and the data that does exist is fragmented. For a mortgage lender, this means collateral valuation is often slow, expensive and based on limited evidence.

    We built Verteo to address this. It is a machine learning model trained on Latvian real estate market data that forecasts the value of individual properties. The output can be used in two ways: as an automated collateral assessment during mortgage underwriting, and as an input feature into credit scoring models.

    Because Verteo connects to our lending platform, a mortgage application can be scored against a current model-driven valuation rather than a manual appraisal completed weeks earlier. The valuation stops being a bottleneck in the process and becomes part of the decision itself.
  meta_title_en: 'Verteo: forecasting Latvian property values with ML — Braingency'
  meta_description_en: A machine learning model trained on Latvian real estate market data, used for automated collateral assessment and as an input to credit scoring.
  title_lv: 'Verteo: Latvijas īpašumu vērtību prognozēšana ar mašīnmācīšanos'
  title_ru: 'Verteo: прогнозирование стоимости латвийской недвижимости с помощью машинного обучения'
  excerpt_lv: Nelielā tirgū salīdzināmu darījumu ir maz, un tie dati, kas ir pieejami, ir sadrumstaloti. Verteo pārvērš ķīlas vērtēšanu no šķēršļa par daļu no lēmuma.
  excerpt_ru: На небольшом рынке сопоставимых сделок мало, а имеющиеся данные разрознены. Verteo превращает оценку залога из узкого места в часть решения.
  body_lv: |-
    Nekustamā īpašuma vērtēšana nelielā tirgū ir sarežģīts uzdevums. Salīdzināmu darījumu ir mazāk nekā lielā tirgū, cenas krasi atšķiras atkarībā no mikrolokācijas, un tie dati, kas ir pieejami, ir sadrumstaloti. Hipotekāro kredītu izsniedzējam tas nozīmē, ka ķīlas vērtēšana bieži ir lēna, dārga un balstīta uz ierobežotiem pierādījumiem.

    Mēs izveidojām Verteo, lai to atrisinātu. Tas ir mašīnmācīšanās modelis, kas apmācīts uz Latvijas nekustamā īpašuma tirgus datiem un prognozē atsevišķu īpašumu vērtību. Rezultātu var izmantot divējādi: kā automatizētu ķīlas novērtējumu hipotekārā kredīta izvērtēšanas laikā un kā ievades datus kredītspējas novērtēšanas modeļos.

    Tā kā Verteo ir savienots ar mūsu kreditēšanas platformu, hipotekāro kredīta pieteikumu var novērtēt pret aktuālu, uz modeli balstītu vērtējumu, nevis manuālu novērtējumu, kas veikts vairākas nedēļas iepriekš. Vērtēšana pārstāj būt šķērslis procesā un kļūst par daļu no paša lēmuma.
  body_ru: |-
    Оценка недвижимости на небольшом рынке — сложная задача. Сопоставимых сделок меньше, чем на крупном рынке, цены резко различаются в зависимости от микрорасположения, а имеющиеся данные разрознены. Для ипотечного кредитора это означает, что оценка залога часто оказывается медленной, дорогой и основанной на ограниченных данных.

    Мы создали Verteo, чтобы решить эту проблему. Это модель машинного обучения, обученная на данных латвийского рынка недвижимости, которая прогнозирует стоимость отдельных объектов. Результат можно использовать двумя способами: как автоматическую оценку залога при ипотечном андеррайтинге и как входной признак для моделей кредитного скоринга.

    Поскольку Verteo подключена к нашей кредитной платформе, ипотечную заявку можно оценивать по актуальной оценке модели, а не по ручной оценке, проведённой несколько недель назад. Оценка перестаёт быть узким местом процесса и становится частью самого решения.
